name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare site files
        run: |
          mkdir -p _site
          rsync -av --exclude='_site' \
                    --exclude='.git' \
                    --exclude='.github' \
                    --exclude='.claude' \
                    --exclude='.DS_Store' \
                    --exclude='*.DS_Store' \
                    . _site/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
